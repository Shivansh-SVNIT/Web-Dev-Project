<!DOCTYPE html>
<html style="background-color: rgb(48, 51, 56);">

    <head>

        <title>Calculator</title>
        <link rel="icon" type="png" href="Calc.png">
        <link rel="stylesheet" href="STYLE/MainStyle1.css">

    </head>

    <body>

        <div class="head">

            <div class="ansDiv">

                <div class="oprationDiv">
                    <p class="opration" id="display1">JS File</p>
                    
                </div>

                <div class="outputDiv">
                    <p class="output" id="display2">Not Found !!</p>
                </div>

                <div class="otherButtonsDiv">
                    <div class="otherButtonDiv">
                        <button id="keyBoard" class="KeyBoardButton">
                            ⌨KeyBoard
                        </button>
                    </div>

                </div>

            </div>

            <div class="calcButtonsDiv">

                <div class="calcButtonDiv">
                    <button id="calcButtonAC" class="DeleteButton">AC</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonCut" class="DeleteButton">←</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonSign" class="OpratorButton">+/-</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonDivision" class="OpratorButton">/</button>
                    


                </div>
                <div class="calcButtonDiv">
                
                    <button id="calcButton7">7</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton8">8</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton9">9</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonMul" class="OpratorButton">x</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton4">4</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton5">5</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton6">6</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonMinus" class="OpratorButton">-</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton1">1</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton2">2</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton3">3</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonPlus" class="OpratorButton">+</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonPers" class="OpratorButton">%</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButton0">0</button>
                    


                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonDot">.</button>
                    <!-- ⌨KeyBoard -->

                </div>
                <div class="calcButtonDiv">
                    <button id="calcButtonEqual" class="EqualButton">=</button>
                </div>



            </div>

        </div>

        <script src="JavaScript/buttons1.js">
                
        </script>
       

    </body>

</html>
